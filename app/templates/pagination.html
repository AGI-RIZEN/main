{% if pagination and pagination.pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if pagination.has_prev %}<a class="button secondary small" href="{{ page_url(pagination.prev_num) }}">Previous</a>{% endif %}
  <span aria-current="page">Page {{ pagination.page }} of {{ pagination.pages }}</span>
  {% if pagination.has_next %}<a class="button secondary small" href="{{ page_url(pagination.next_num) }}">Next</a>{% endif %}
</nav>
{% endif %}
